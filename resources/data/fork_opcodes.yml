# Opcodes this fork knows that upstream's opcodes.yml doesn't.
#
# They live here, not in opcodes.yml, so upstream's patch updates merge without touching them. The build merges them
# into the same generated enums.
#
# Opcodes change with every game version, so each entry says which client version its opcode was found on
# (found_on.) An entry whose found_on isn't SUPPORTED_GAME_VERSION (constants.yml), or that has no opcode, is
# "outstanding": the build warns about it and gives it a placeholder opcode the game never uses, so it can't be mistaken
# for some other packet until it's found again.
#
# Reading them from the game: the world server reads ffxiv_dx11.exe from the game folder at startup (when its
# ffxivgame.ver is SUPPORTED_GAME_VERSION) and runs each entry's finders (find):
#   * immediate: the opcode is written into the code. `pattern` (hex bytes, ?? for any) is searched for, and the opcode
#     is the `width`-byte number `offset` bytes in. With `with: <name>`, only matches in a function that also writes
#     that packet's (known) opcode count, to tell apart code that looks the same.
#   * handler: `pattern` is in the packet's handler in the client, and the opcode is the dispatcher case that leads
#     there. Packets that share a handler (e.g. one in several sizes) can only be confirmed this way, not found.
# An outstanding opcode that's read is used straight away, and the log says what to save here. A known one is checked
# against its finders, so one that stops working is noticed. tools/opcodescan does the same from the command line
# (cargo run --release -p kawari-opcodescan -- <game folder>), and has commands for exploring the executable.
#
# Finding an outstanding one by hand:
#   * Client packets (Client*IpcType): do what how_to_find says on Kawari. The server warns about the unknown packet,
#     and when its size matches an outstanding entry it says which one it probably is. Put that opcode here and set
#     found_on to the current version.
#   * Server packets (Server*IpcType): Kawari can't see these fail. Record the same thing on retail (Kawari Recorder) on
#     the same game version, and look the packet up there.
#   * In game, !forkopcodes lists them all and what to do for each.
#
# If upstream adds an opcode with the same name, theirs is used and the build says this entry can go.
#
# Fields: name, comment, size (data only, without headers, as in opcodes.yml), opcode, found_on, how_to_find, find.
# Keep double quotes out of comments.

ClientZoneIpcType:
- name: LootRoll
  comment: Need, Greed or Pass on one item of an open coffer - the coffer, the item's slot, the choice (1 need, 2 greed, 5 pass.)
  # 766 on 2026.10.16 (Bob's Chronofoil capture of Sastasha, 2026-10-22: 15 rolls, each answered by LootRollResult.)
  opcode: 766
  size: 16
  found_on: 2026.10.16.0000.0000
  how_to_find: On Kawari, open a coffer in a dungeon and press Greed on an item - the 16-byte packet starting with the coffer's ID.
- name: EventReturnHandler16
  comment: A scene finished with up to 16 results, e.g. handing three kinds of items over in a quest's NPC trade (Surveying the Damage.)
  # 856 on 2026.09.15, 200 on 2026.10.06, 555 on 2026.10.16 (read from the game by its finder.)
  opcode: 555
  size: 72
  found_on: 2026.10.16.0000.0000
  how_to_find: In Surveying the Damage, hand Pauline all three items in one trade (//gm quest incomplete 175, //gm quest accept 175, //gm quest sequence 175 1, then search the four spots in the cave.)
  find:
  # The client picks the EventReturnHandler by how many results a scene has: up to 2, 4, 8, 16... Its 16 case writes
  # this
  # opcode and the packet's size with its header (0x58 = 88.) The event yield sender has the same code, so only the
  # function that also writes EventReturnHandler2's opcode counts.
  - immediate:
      pattern: 40 80 FF 10 77 ?? 0F 10 03 C7 44 24 20 ?? ?? ?? ?? 48 8B C8 0F 10 4B 10 48 C7 44 24 28 58 00 00 00
      offset: 13
      width: 4
      with: EventReturnHandler2
- name: SetAdventurerPlatePortrait
  comment: The client sets its adventurer plate's portrait (Portraits window), sent back in PortraitsInformation.
  # 107 on 2026.10.06; 431 on 2026.10.16 (read from the game by its finder.)
  opcode: 431
  size: 56
  found_on: 2026.10.16.0000.0000
  how_to_find: Open the Portraits window, pick a portrait and set it as the adventurer plate's. The server warns about an unknown packet of this size.
  find:
  # The function that sends it writes this opcode and the packet's size with its header (0x48 = 72) before copying the
  # portrait.
  - immediate:
      pattern: C7 44 24 58 ?? ?? ?? ?? 48 C7 44 24 60 48 00 00 00 0F 11 01
      offset: 4
      width: 4
- name: UpdateAdventurerPlate
  comment: The client saves its adventurer plate (CharaCardData), sent back in AdventurerPlate.
  # 795 on 2026.10.06; 350 on 2026.10.16 (read from the game by its finder.)
  opcode: 350
  size: 200
  found_on: 2026.10.16.0000.0000
  how_to_find: Open the Adventurer Plate, change something and save it. The server warns about an unknown packet of this size.
  find:
  # The function that sends it writes this opcode, copies the plate and writes the size with its header (0xD8 = 216).
  - immediate:
      pattern: C7 84 24 E0 00 00 00 ?? ?? ?? ?? 0F 10 00 48 8D 8C 24 04 01 00 00
      offset: 7
      width: 4
- name: MarketBoardOpened
  comment: Sent as the marketboard window opens, before any search - answered with an empty MarketBoardItems carrying its request ID.
  # 156 on 2026.09.15 (Bob's Chronofoil captures: sent as the window opened, answered within 0.1 s with an empty search
  # result); 683 on 2026.10.06, the same moment and size in Bob's 2026-10-17 bundle.
  # 319 on 2026.10.16 (its send function matched to 2026.10.06's in Bob's ffxiv_dx11.exe for both versions, and sent
  # as the window opened in Bob's bundle of 2026-10-20.)
  opcode: 319
  size: 8
  found_on: 2026.10.16.0000.0000
  how_to_find: Open the marketboard. The server warns about an unknown 8-byte packet as the window opens.
  find:
  # The function that sends it (as the window opens) writes this opcode and the packet's size with its header (0x18
  # = 24), then sets the window's request number. Unique in 2026.10.06 and 2026.10.16.
  - immediate:
      pattern: C7 44 24 20 ?? ?? ?? ?? 8D 4A 01 48 C7 44 24 28 18 00 00 00 88 4B 18 48 8D 54 24 20 48 8B C8 E8
      offset: 4
      width: 4
- name: MarketBoardPurchaseHandler
  comment: Buying a marketboard listing - its retainer and listing IDs, item, quantity, price and tax as the client saw them.
  # 765 on 2026.09.15 (Bob's Chronofoil captures); 258 on 2026.10.06 is FFXIVOpcodes' (7.57), not yet seen on Kawari.
  # 245 on 2026.10.16 (FFXIVOpcodes' (7.57h), its send function matched to 2026.10.06's in Bob's ffxiv_dx11.exe for
  # both versions, and the 40-byte packet of Bob's purchases in his bundle of 2026-10-20.)
  opcode: 245
  size: 40
  found_on: 2026.10.16.0000.0000
  how_to_find: Buy anything on the marketboard. If nothing happens, the server warns about an unknown 40-byte packet - that's this one.
  find:
  # The function that sends it writes this opcode and the packet's size with its header (0x38 = 56), then calls the
  # sender. Unique in 2026.10.06 and 2026.10.16.
  - immediate:
      pattern: C7 44 24 20 ?? ?? ?? ?? 48 C7 44 24 28 38 00 00 00 E8
      offset: 4
      width: 4
- name: RequestPlayerRetainerInfo
  comment: The client asks for its retainers for the marketboard, as a retainer's sale list opens - answered with PlayerRetainerInfo.
  # 580 on 2026.09.15, 818 on 2026.10.06 (Bob's Chronofoil captures; all zeros, each answered within 0.1 s.)
  # 348 on 2026.10.16 (its send function matched to 2026.10.06's in Bob's ffxiv_dx11.exe for both versions - it has
  # no arguments, so its code is the same as other requests, but it sits in the same place among the marketboard
  # senders, 0x640 on like its neighbours.)
  opcode: 348
  size: 8
  found_on: 2026.10.16.0000.0000
  how_to_find: Call a retainer at a summoning bell (one hired with !retainer hire) and open Sell items in your inventory. The server warns about an unknown 8-byte packet as the window opens.
- name: RequestRetainerSaleHistory
  comment: The client asks for a retainer's sale history (the retainer's ID) - answered with RetainerSaleHistory.
  # 243 on 2026.09.15, 274 on 2026.10.06 (Bob's Chronofoil captures.)
  # 372 on 2026.10.16 (its send function matched to 2026.10.06's in Bob's ffxiv_dx11.exe for both versions.)
  opcode: 372
  size: 8
  found_on: 2026.10.16.0000.0000
  how_to_find: Call a retainer at a summoning bell and open their sale history. The server warns about an unknown 8-byte packet holding the retainer's ID.
- name: ActionRequestGroundTargeted
  comment: The client uses a ground-targeted action (Asylum, Sacred Soil...) - the action and where on the ground.
  # 490 on 2026.06.18, 212 on 2026.09.01, 891 on 2026.09.15 (Bob's Chronofoil captures, all Asylum); 846 on 2026.10.06
  # is FFXIVOpcodes' (7.57), not yet seen on Kawari.
  # 492 on 2026.10.16 (FFXIVOpcodes' (7.57h), and its send function matched to 2026.10.06's in Bob's ffxiv_dx11.exe
  # for both versions.)
  opcode: 492
  size: 24
  found_on: 2026.10.16.0000.0000
  how_to_find: Place Asylum (White Mage) or another ground-targeted action on the ground. The server warns about an unknown 24-byte packet starting with the action's ID.
  find:
  # The function that sends it writes this opcode and the packet's size with its header (0x28 = 40), then the
  # action's ID. Unique in 2026.10.06 and 2026.10.16.
  - immediate:
      pattern: C7 44 24 20 ?? ?? ?? ?? 48 C7 44 24 28 28 00 00 00 89 74 24
      offset: 4
      width: 4
- name: SetRetainerAppearance
  comment: The appearance chosen for a new retainer at the retainer vocate - voice, then CustomizeData.
  # 670 on 2026.10.06 (Bob's Chronofoil capture of 2026-10-18; the new retainer's SpawnNpc had exactly this.)
  # 463 on 2026.10.16 (its send function matched to 2026.10.06's in Bob's ffxiv_dx11.exe for both versions.)
  opcode: 463
  size: 32
  found_on: 2026.10.16.0000.0000
  how_to_find: Hire a retainer at a retainer vocate and finish the appearance editor. The server warns about an unknown 32-byte packet.
  find:
  # The function that sends it writes this opcode and the packet's size with its header (0x30 = 48), then copies the
  # appearance. Unique in 2026.10.06 and 2026.10.16.
  - immediate:
      pattern: C7 44 24 20 ?? ?? ?? ?? 48 C7 44 24 28 30 00 00 00 0F 10 00
      offset: 4
      width: 4
ServerZoneIpcType:
- name: LootList
  comment: An opened coffer's loot, to the party - the coffer, how many items, the seconds left to roll (three times) and the items.
  # 272 on 2026.10.16 (Bob's Chronofoil capture of Sastasha, 2026-10-22: 15 coffers, just before OpenedTreasure.)
  opcode: 272
  size: 88
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with Chronofoil, open a coffer in a dungeon - the 88-byte packet starting with the coffer's ID, right before OpenedTreasure.
- name: LootItem
  comment: One item of an opened coffer's loot - the coffer, the item, the time left, its slot and whether it's unique; again when the player opens it themselves.
  # 975 on 2026.10.16 (Bob's Chronofoil capture of Sastasha, 2026-10-22: one per item after LootList.)
  opcode: 975
  size: 56
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with Chronofoil, open a coffer in a dungeon - the 56-byte packets right after LootList, one per item.
- name: LootRollResult
  comment: The answer to the player's LootRoll - the coffer, the slot, then 1 and the roll (need or greed), 4 (passed) or 8 (refused.)
  # 462 on 2026.10.16 (Bob's Chronofoil capture of Sastasha, 2026-10-22: 15, one per LootRoll.)
  opcode: 462
  size: 16
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with Chronofoil, press Greed on a coffer's item - the 16-byte packet starting with the coffer's ID right after.
- name: LootResult
  comment: Who won an item of a coffer - the coffer, the slot, the winner and their roll (0xE0000000 and 0 when everyone passed.)
  # 807 on 2026.10.16 (Bob's Chronofoil capture of Sastasha, 2026-10-22: 18, after each item's last rolls.)
  opcode: 807
  size: 16
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with Chronofoil, let a coffer's item be rolled for - the 16-byte packet starting with the coffer's ID after the rolls' LootMessages.
- name: LootMessage
  comment: Loot - an item obtained directly (an enemy's drop), gil, need/greed rolls and their winners.
  # 936 on 2026.06.18, 135 on 2026.09.01, 351 on 2026.09.15, 190 on 2026.10.06 (Bob's Chronofoil captures.)
  # 154 on 2026.10.16 (its case in the zone dispatcher matched to 2026.10.06's in Bob's ffxiv_dx11.exe for both
  # versions (the other match, 821, is UpdateClassInfo).)
  opcode: 154
  size: 32
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with Chronofoil, defeat an enemy that drops an item - the 32-byte packet starting 03000000 right after the kill's EXP.
- name: RetainerStateNotice
  comment: Eight bytes sent before every RetainerState and after a retainer's containers (zeros; 0 then 1 before sending away a retainer whose market changed.)
  # 897 on 2026.09.15, 144 on 2026.10.06 (Bob's Chronofoil captures.)
  # 987 on 2026.10.16 (its case in the zone dispatcher matched to 2026.10.06's in Bob's ffxiv_dx11.exe for both
  # versions.)
  opcode: 987
  size: 8
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with Chronofoil, call a retainer - the 8-byte packet right before RetainerState.
- name: RetainerState
  comment: A retainer is called (state 4), sent away (state 3) or hired (state 1) - their ID and name.
  # 908 on 2026.09.15 (Bob's Chronofoil captures, FFXIVOpcodes' RetainerState there); 249 on 2026.10.06, seen in Bob's
  # capture of 2026-10-18.
  # 735 on 2026.10.16 (FFXIVOpcodes' (7.57h), and its dispatcher case matched to 2026.10.06's in Bob's
  # ffxiv_dx11.exe for both versions.)
  opcode: 735
  size: 56
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with the Kawari Recorder or Chronofoil, call a retainer at a summoning bell - the 56-byte packet with their ID and name, right after choosing them.
- name: PlayerRetainerInfo
  comment: The character's retainers for the marketboard's listings, the reply to RequestPlayerRetainerInfo.
  # 599 on 2026.09.15, 712 on 2026.10.06 (Bob's Chronofoil captures.)
  # 715 on 2026.10.16 (FFXIVOpcodes' (7.57h), and its dispatcher case matched to 2026.10.06's in Bob's
  # ffxiv_dx11.exe for both versions.)
  opcode: 715
  size: 480
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with the Kawari Recorder or Chronofoil, call a retainer and open Sell items in your inventory - the 480-byte reply.
- name: ItemMarketBoardInfo
  comment: The asking price of one item a retainer has on the market, sent with their containers as they're called.
  # 313 on 2026.09.15, 387 on 2026.10.06 (Bob's Chronofoil captures.)
  # 471 on 2026.10.16 (FFXIVOpcodes' (7.57h); it shares its dispatcher case with ItemMarketBoardSummary, matched to
  # 2026.10.06's in Bob's ffxiv_dx11.exe for both versions.)
  opcode: 471
  size: 32
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with the Kawari Recorder or Chronofoil, call a retainer who has items on the market - one 32-byte packet per item after their containers.
- name: ItemMarketBoardSummary
  comment: How many items a retainer has on the market, after their ItemMarketBoardInfos.
  # 442 on 2026.09.15, 303 on 2026.10.06 (Bob's Chronofoil captures.)
  # 290 on 2026.10.16 (FFXIVOpcodes' (7.57h); it shares its dispatcher case with ItemMarketBoardInfo, matched to
  # 2026.10.06's in Bob's ffxiv_dx11.exe for both versions.)
  opcode: 290
  size: 8
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with the Kawari Recorder or Chronofoil, call a retainer - the 8-byte packet after their containers (sequence, then how many items they have on the market.)
- name: RetainerSaleHistory
  comment: A retainer's sale history, the reply to RequestRetainerSaleHistory.
  # 161 on 2026.09.15, 832 on 2026.10.06 (Bob's Chronofoil captures.)
  # 551 on 2026.10.16 (FFXIVOpcodes' (7.57h), and its dispatcher case matched to 2026.10.06's in Bob's
  # ffxiv_dx11.exe for both versions (the other match, 730, is MarketBoardItemListingHistory).)
  opcode: 551
  size: 1048
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with the Kawari Recorder or Chronofoil, call a retainer and open their sale history - the 1048-byte reply.
- name: MarketBoardPurchase
  comment: A marketboard purchase went through - the item and how many, after the gil and inventory updates.
  # 665 on 2026.09.15 (Bob's Chronofoil captures); 610 on 2026.10.06 is FFXIVOpcodes' (7.57), not yet seen working.
  # 353 on 2026.10.16 (FFXIVOpcodes' (7.57h), and its dispatcher case matched to 2026.10.06's in Bob's
  # ffxiv_dx11.exe for both versions.)
  opcode: 353
  size: 16
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with the Kawari Recorder or Chronofoil, buy something on the marketboard - the 16-byte packet after the inventory updates (item ID, then quantity.)
- name: EventNotice2
  comment: A notice from an event with up to 2 arguments, e.g. a quest's progress pop-up as an enemy is defeated.
  # 386 on 2026.10.06; 834 on 2026.10.16 (one of the five notice opcodes (467, 561, 834, 927, 928) - see below; Bob's
  # Chronofoil capture of 2026-10-20 has the 16-byte notices as 834: Close to Home's, and the aetheryte's.)
  opcode: 834
  size: 16
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with the Kawari Recorder, kill an enemy a quest counts (e.g. You Shall Not Trespass) - its pop-up is this packet, sent to the quest's handler with 2 args or fewer.
  find:
  # Every size of the notice goes to this one handler, so the finder can only say which opcodes are notices (it confirms
  # this one is still among them); a recording says which size is which. The client doesn't need to know: in
  # 2026.10.16's zone dispatcher all five cases are the same code, which reads the handler ID, notice ID, argument count
  # and arguments from the packet (offsets 0x10, 0x14, 0x15, 0x18 with the IPC header) - so any two of them show
  # notices correctly. 2026.10.16's are from a recording (see the comments on the opcodes).
  - handler:
      pattern: 41 0F B6 D9 49 8B F8 0F B6 F2 8B E9 E8 ?? ?? ?? ?? 4C 8B CF 88 5C 24 20 44 0F B6 C6 8B D5 48 8B C8 E8
- name: EventNotice4
  comment: A notice from an event with 3 or 4 arguments.
  # 210 on 2026.10.06; 467 on 2026.10.16 (one of the five notice opcodes (467, 561, 834, 927, 928) - see EventNotice2;
  # the 24-byte notices are 467 in Bob's Chronofoil capture of 2026-10-20, with 3 arguments.)
  opcode: 467
  size: 24
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with the Kawari Recorder, a quest notice with 3 arguments (e.g. in Salvaging the Scene) - sent to the quest's handler.
  find:
  - handler:
      pattern: 41 0F B6 D9 49 8B F8 0F B6 F2 8B E9 E8 ?? ?? ?? ?? 4C 8B CF 88 5C 24 20 44 0F B6 C6 8B D5 48 8B C8 E8
- name: Achievements
  comment: The completed achievements and the last five, the reply to the client asking for them (client trigger 1001).
  # 991 on 2026.10.06; 985 on 2026.10.16 (read from the game by its finder.)
  opcode: 985
  size: 552
  found_on: 2026.10.16.0000.0000
  how_to_find: On retail with the Kawari Recorder, open the Achievements window - the reply is this packet.
  find:
  # HandleAchievementsPacket in FFXIVClientStructs.
  - handler:
      pattern: 4C 8D 89 ?? ?? ?? ?? 48 8B D1
